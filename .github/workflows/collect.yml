name: 자동 수집 (온디맨드 배치)

# 매일 1번(KST 9시 = UTC 0시) 여러 소스를 크롤링해 Supabase에 신규 공고만 채운다.
# 서버를 상시 띄우지 않고 GitHub Actions 무료 스케줄로 돌린다(docs/데이터-수집.md 신선도 원칙).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {} # 수동으로 바로 실행해 테스트할 때 씀

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 의존성 설치
        working-directory: server
        run: npm ci
      - name: 수집 실행
        working-directory: server
        run: node batch/collect.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}
          SCHOLARSHIP_API_KEY: ${{ secrets.SCHOLARSHIP_API_KEY }}
