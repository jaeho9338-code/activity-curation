name: 자동 수집 (온디맨드 배치)

# 매일 1번(KST 9시 = UTC 0시) 여러 소스를 크롤링해 Supabase에 신규 공고만 채운다.
# 서버를 상시 띄우지 않고 GitHub Actions 무료 스케줄로 돌린다(docs/데이터-수집.md 신선도 원칙).
# 참고: 위비티·부산청년플랫폼은 GitHub 러너(데이터센터 IP)를 차단해(403/연결거부) CI에선 0건이 정상이다.
# 버그가 아니라 IP 차단이라 무료로는 못 뚫는다. 이 둘은 소량이라 필요할 때 로컬에서 수동 수집한다.
# 수집기는 소스 하나가 실패해도 나머지는 그대로 진행한다(각 소스 try/catch).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {} # 수동으로 바로 실행해 테스트할 때 씀

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 의존성 설치
        working-directory: server
        run: npm ci
      - name: 수집 실행
        working-directory: server
        run: node batch/collect.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}
          SCHOLARSHIP_API_KEY: ${{ secrets.SCHOLARSHIP_API_KEY }}
